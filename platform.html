<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="stijl/logo/ptje.svg">
<title>Platformbeheer — Keuzebord</title>
<link rel="stylesheet" href="stijl/css/fonts.css?v=22oktober2026-b761eef8">
<link rel="stylesheet" href="stijl/css/tokens.css?v=22oktober2026-b761eef8">
<link rel="stylesheet" href="src/kb-stijl.css?v=22oktober2026-b761eef8">
<style>
body{ background: var(--vlak-2); }
.knoprij{ display:flex; gap:10px; flex-wrap:wrap; }
.knoprij-onder{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.hint{ font-size:.87rem; color:var(--inkt-3); line-height:1.55; max-width:66ch; }
.paneel{ background:var(--vlak); border-radius:var(--rond-m); box-shadow:var(--schaduw-1);
         padding:20px 22px; margin-top:22px; }
.paneelkop{ font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
            color:var(--inkt-3); margin-bottom:10px; }
.leegvak{ padding:30px; border:1.5px dashed var(--lijn); border-radius:var(--rond-m); text-align:center; }

.scholen{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; }
.schoolkaart{ background:var(--vlak); border-radius:var(--rond-m); box-shadow:var(--schaduw-1);
              padding:18px 20px; display:flex; flex-direction:column; gap:14px;
              border-top:4px solid var(--accent); }
.schoolnaam{ font-size:1.15rem; font-weight:600; letter-spacing:-.015em; }
/* De cijfers zijn het enige wat hier van een school te zien is. Geen
   kinderen, geen borden -- zie docs/ROLLEN.md. */
.cijfers{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px; }
.cijfer{ display:flex; flex-direction:column; gap:1px; }
.cijfer b{ font-size:1.35rem; font-weight:620; letter-spacing:-.02em; color:var(--inkt);
           font-variant-numeric:tabular-nums; }
.cijfer span{ font-size:.73rem; color:var(--inkt-3); letter-spacing:.01em; }
.stil{ font-size:.8rem; color:var(--inkt-3); margin-top:auto; padding-top:4px; }
.deur{ font-size:.8rem; font-weight:550; color:var(--let-op); background:var(--let-op-zacht);
       padding:6px 10px; border-radius:var(--rond-vol); align-self:flex-start; }
.deur.geenbeheer{ color:var(--stop); background:var(--stop-zacht); }
.schoolkaart button.weg{ color:var(--stop); }
.schoolkaart button.weg:hover{ background:var(--stop-zacht); }

/* ── de accountslijst ──────────────────────────────────────────────
   Eén rij per mens. Naam en gebruikersnaam links, de rol als merkje in
   het midden, de knoppen rechts -- en op een smal scherm vallen die
   onder elkaar in plaats van dat de naam wordt afgeknepen. */
.filterbalk{ display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 12px; }
.zoekveld{ flex:1 1 280px; }
.kiesveld{ flex:0 1 220px; }
.mensrij{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
          padding:11px 14px; border-radius:12px; background:var(--vlak-2);
          margin-bottom:8px; }
.menslinks{ flex:1 1 200px; min-width:0; }
.mensnaam{ font-size:.96rem; font-weight:560; letter-spacing:-.01em; color:var(--inkt);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mensonder{ font-size:.78rem; color:var(--inkt-3); margin-top:1px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mensrol{ flex:0 0 132px; }
.rolmerk{ font-size:.72rem; font-weight:620; letter-spacing:.02em; white-space:nowrap;
          padding:4px 10px; border-radius:var(--rond-vol);
          background:rgba(20,28,44,.07); color:var(--inkt-2); }
.rolmerk.beheer{ background:var(--accent-zacht); color:var(--accent); }
.rolmerk.platform{ background:var(--let-op-zacht); color:var(--let-op); }
.mensrij .knoprij{ margin-left:auto; }
.mensrij .hint{ font-size:.78rem; }
.mensrij button.weg{ color:var(--stop); }
.mensrij button.weg:hover{ background:var(--stop-zacht); }
@media (max-width:760px){ .mensrol{ flex:0 0 auto; } .mensrij .knoprij{ margin-left:0; } }

/* ── de meldingen ──────────────────────────────────────────────────
   Eén kaart per melding. De tekst krijgt de ruimte -- dat is waar het
   om gaat; de herkomst staat er klein onder. */
.melding-kaart{ padding:14px 16px; border-radius:12px; background:var(--vlak-2);
                margin-bottom:10px; }
.melding-kop{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.melding-stand{ font-size:.72rem; font-weight:620; letter-spacing:.02em;
                padding:4px 10px; border-radius:var(--rond-vol);
                background:rgba(20,28,44,.07); color:var(--inkt-2); }
.melding-stand.stand-nieuw{ background:var(--stop-zacht); color:var(--stop); }
.melding-stand.stand-opgepakt{ background:var(--let-op-zacht); color:var(--let-op); }
.melding-tijd{ font-size:.76rem; color:var(--inkt-3); margin-left:auto;
               font-variant-numeric:tabular-nums; }
.melding-tekst{ font-size:.95rem; line-height:1.6; color:var(--inkt);
                white-space:pre-wrap; overflow-wrap:anywhere; }
.melding-onder{ font-size:.76rem; color:var(--inkt-3); margin-top:6px;
                overflow-wrap:anywhere; }
.melding-notitie{ font-size:.83rem; line-height:1.5; color:var(--inkt-2);
                  margin-top:8px; padding:8px 11px; border-radius:9px;
                  background:var(--vlak); border-left:3px solid var(--lijn);
                  white-space:pre-wrap; }
.melding-kaart .knoprij{ margin-top:10px; }
/* Een uitvoerknop zonder iets om uit te voeren. Niet verbergen: dan
   verspringt de kop zodra er een melding binnenkomt. */
.knop.uit{ opacity:.45; pointer-events:none; }
a.knop{ text-decoration:none; }

/* Een waarschuwing in een blad: wat er gaat gebeuren, vóór de knop en
   niet erna. */
.waarschuwing{ margin-top:8px; padding:10px 12px; border-radius:11px;
               background:var(--let-op-zacht); color:var(--let-op);
               font-size:.83rem; line-height:1.5; }

.logrij{ display:flex; align-items:baseline; justify-content:space-between; gap:14px;
         padding:9px 13px; border-radius:11px; background:var(--vlak-2); margin-bottom:7px; }
.logwat{ font-size:.9rem; color:var(--inkt); }
.logtijd{ font-size:.76rem; color:var(--inkt-3); white-space:nowrap;
          font-variant-numeric:tabular-nums; }

.veldrij{ margin:16px 0; }
.veldlabel{ display:block; font-size:.83rem; font-weight:550; color:var(--inkt-2);
            margin-bottom:7px; letter-spacing:-.008em; }
.codevak{ margin:18px 0; padding:18px; border-radius:14px; text-align:center;
          background:var(--accent-zacht); border:1.5px dashed var(--accent); }
.codetekst{ font-size:2rem; font-weight:650; letter-spacing:.22em;
            font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color:var(--accent); }

/* De meekijkbalk. Bovenaan, over de volle breedte, en niet weg te
   klikken -- alleen de knop Stoppen haalt hem weg. De pagina schuift er
   netjes onder vandaan in plaats van eronder te verdwijnen. */
#meekijkbalk{ position:fixed; top:0; left:0; right:0; height:46px; z-index:9999;
              display:flex; align-items:center; justify-content:center; gap:12px;
              padding:0 16px; background:#8a4b12; color:#fff;
              font:500 .86rem/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
              box-shadow:0 1px 0 rgba(20,28,44,.2); }
#meekijkbalk b{ font-weight:650; letter-spacing:-.01em; }
#meekijkbalk span{ opacity:.82; }
#meekijkbalk button{ font:inherit; font-weight:600; color:#fff; cursor:pointer;
                     background:rgba(255,255,255,.18); border:0; border-radius:999px;
                     padding:6px 13px; white-space:nowrap; }
#meekijkbalk button:hover{ background:rgba(255,255,255,.3); }
body.metbalk{ padding-top:46px; box-sizing:border-box; }
body.metbalk .zijbalk{ height:calc(100vh - 46px); top:46px; }
@media (max-width:640px){ #meekijkbalk span{ display:none; } }

@media print{
  /* Alles weg behalve het blad zelf. Een leerkracht krijgt een kaartje
     met haar inloggegevens, geen schermafdruk van het beheer. */
  .app, .melding{ display:none !important; }
  .overlay{ position:static !important; display:block !important;
            background:none !important; backdrop-filter:none !important;
            padding:0 !important; opacity:1 !important; }
  .blad{ box-shadow:none !important; border-radius:0 !important;
         max-width:none !important; width:auto !important;
         max-height:none !important; transform:none !important;
         animation:none !important; padding:0 !important; }
  .nietprinten{ display:none !important; }
  body{ background:#fff !important; }
  @page{ margin: 18mm; }
}
</style>
</head>
<body>

<div class="app">
  <nav class="zijbalk">
    <div class="zij-kop">
      <img class="merkteken" src="stijl/logo/ptje.svg" alt="" aria-hidden="true">
      <div class="zij-kop-tekst">
        <div class="n">Keuzebord</div>
        <div class="s">Platformbeheer</div>
      </div>
    </div>
    <div class="zij-menu" id="zij-menu"></div>
    <div class="zij-onder">
      <a class="zij-link" href="inloggen.html" id="afmelden">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 l-7 7 7 7"></path></svg>
        Afmelden
      </a>
    </div>
  </nav>
  <main class="inhoud" id="inhoud"></main>
</div>

<div class="overlay" id="overlay"><div class="blad" id="blad"></div></div>
<div class="melding" id="melding"></div>

<!-- kb-app.js zegt welke uitgave dit is; de testchip leest daar of
     deze app een testversie is. -->
<script src="src/kb-app.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-testbanner.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-verhuizing.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-supabase.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-feedback.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-kaartje.js?v=22oktober2026-b761eef8"></script>
<script src="src/kb-platform.js?v=22oktober2026-b761eef8"></script>
</body>
</html>
