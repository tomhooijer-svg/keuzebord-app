<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="stijl/logo/ptje.svg">
<title>Platformbeheer — Keuzebord</title>
<link rel="stylesheet" href="stijl/css/fonts.css?v=22oktober2026-b6db7e52">
<link rel="stylesheet" href="stijl/css/tokens.css?v=22oktober2026-b6db7e52">
<link rel="stylesheet" href="src/kb-stijl.css?v=22oktober2026-b6db7e52">
<style>
body{ background: var(--vlak-2); }
.knoprij{ display:flex; gap:10px; flex-wrap:wrap; }
.knoprij-onder{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.hint{ font-size:.87rem; color:var(--inkt-3); line-height:1.55; max-width:66ch; }
.paneel{ background:var(--vlak); border-radius:var(--rond-m); box-shadow:var(--schaduw-1);
         padding:20px 22px; margin-top:22px; }
.paneelkop{ font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
            color:var(--inkt-3); margin-bottom:10px; }
.leegvak{ padding:30px; border:1.5px dashed var(--lijn); border-radius:var(--rond-m); text-align:center; }

.scholen{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; }
.schoolkaart{ background:var(--vlak); border-radius:var(--rond-m); box-shadow:var(--schaduw-1);
              padding:18px 20px; display:flex; flex-direction:column; gap:14px;
              border-top:4px solid var(--accent); }
.schoolnaam{ font-size:1.15rem; font-weight:600; letter-spacing:-.015em; }
/* De cijfers zijn het enige wat hier van een school te zien is. Geen
   kinderen, geen borden -- zie docs/ROLLEN.md. */
.cijfers{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px; }
.cijfer{ display:flex; flex-direction:column; gap:1px; }
.cijfer b{ font-size:1.35rem; font-weight:620; letter-spacing:-.02em; color:var(--inkt);
           font-variant-numeric:tabular-nums; }
.cijfer span{ font-size:.73rem; color:var(--inkt-3); letter-spacing:.01em; }
.stil{ font-size:.8rem; color:var(--inkt-3); margin-top:auto; padding-top:4px; }
.deur{ font-size:.8rem; font-weight:550; color:var(--let-op); background:var(--let-op-zacht);
       padding:6px 10px; border-radius:var(--rond-vol); align-self:flex-start; }

.logrij{ display:flex; align-items:baseline; justify-content:space-between; gap:14px;
         padding:9px 13px; border-radius:11px; background:var(--vlak-2); margin-bottom:7px; }
.logwat{ font-size:.9rem; color:var(--inkt); }
.logtijd{ font-size:.76rem; color:var(--inkt-3); white-space:nowrap;
          font-variant-numeric:tabular-nums; }

.veldrij{ margin:16px 0; }
.veldlabel{ display:block; font-size:.83rem; font-weight:550; color:var(--inkt-2);
            margin-bottom:7px; letter-spacing:-.008em; }
.codevak{ margin:18px 0; padding:18px; border-radius:14px; text-align:center;
          background:var(--accent-zacht); border:1.5px dashed var(--accent); }
.codetekst{ font-size:2rem; font-weight:650; letter-spacing:.22em;
            font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color:var(--accent); }

/* De meekijkbalk. Bovenaan, over de volle breedte, en niet weg te
   klikken -- alleen de knop Stoppen haalt hem weg. De pagina schuift er
   netjes onder vandaan in plaats van eronder te verdwijnen. */
#meekijkbalk{ position:fixed; top:0; left:0; right:0; height:46px; z-index:9999;
              display:flex; align-items:center; justify-content:center; gap:12px;
              padding:0 16px; background:#8a4b12; color:#fff;
              font:500 .86rem/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
              box-shadow:0 1px 0 rgba(20,28,44,.2); }
#meekijkbalk b{ font-weight:650; letter-spacing:-.01em; }
#meekijkbalk span{ opacity:.82; }
#meekijkbalk button{ font:inherit; font-weight:600; color:#fff; cursor:pointer;
                     background:rgba(255,255,255,.18); border:0; border-radius:999px;
                     padding:6px 13px; white-space:nowrap; }
#meekijkbalk button:hover{ background:rgba(255,255,255,.3); }
body.metbalk{ padding-top:46px; box-sizing:border-box; }
body.metbalk .zijbalk{ height:calc(100vh - 46px); top:46px; }
@media (max-width:640px){ #meekijkbalk span{ display:none; } }

@media print{
  /* Alles weg behalve het blad zelf. Een leerkracht krijgt een kaartje
     met haar inloggegevens, geen schermafdruk van het beheer. */
  .app, .melding{ display:none !important; }
  .overlay{ position:static !important; display:block !important;
            background:none !important; backdrop-filter:none !important;
            padding:0 !important; opacity:1 !important; }
  .blad{ box-shadow:none !important; border-radius:0 !important;
         max-width:none !important; width:auto !important;
         max-height:none !important; transform:none !important;
         animation:none !important; padding:0 !important; }
  .nietprinten{ display:none !important; }
  body{ background:#fff !important; }
  @page{ margin: 18mm; }
}
</style>
</head>
<body>

<div class="app">
  <nav class="zijbalk">
    <div class="zij-kop">
      <div class="n">Keuzebord</div>
      <div class="s">Platformbeheer</div>
    </div>
    <div class="zij-menu" id="zij-menu"></div>
    <div class="zij-onder">
      <a class="zij-link" href="inloggen.html" id="afmelden">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 l-7 7 7 7"></path></svg>
        Afmelden
      </a>
    </div>
  </nav>
  <main class="inhoud" id="inhoud"></main>
</div>

<div class="overlay" id="overlay"><div class="blad" id="blad"></div></div>
<div class="melding" id="melding"></div>

<!-- kb-app.js zegt welke uitgave dit is; de testchip leest daar of
     deze app een testversie is. -->
<script src="src/kb-app.js?v=22oktober2026-b6db7e52"></script>
<script src="src/kb-testbanner.js?v=22oktober2026-b6db7e52"></script>
<script src="src/kb-supabase.js?v=22oktober2026-b6db7e52"></script>
<script src="src/kb-kaartje.js?v=22oktober2026-b6db7e52"></script>
<script src="src/kb-platform.js?v=22oktober2026-b6db7e52"></script>
</body>
</html>
