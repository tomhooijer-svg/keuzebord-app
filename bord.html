/* ── het bord ─────────────────────────────────────────── */
/* Een zachte, warme ondergrond. Warm met opzet: het beheer staat op een
   koele, en daaraan zie je in een oogopslag in welke van de twee je zit.

   Hij was vrolijker dan dit -- drie gekleurde vegen in de hoeken. Dat
   werkte toen de kaarten zelf ook gekleurd waren, maar nu de kaarten wit
   zijn is elke kleur op het scherm een mededeling, en dan mag een
   ondergrond geen mededeling doen. Wat overblijft is warmte zonder
   onderwerp: je ziet dat het er is, je kijkt er niet naar. */
body.bord{
  background:
    radial-gradient(1200px 700px at 12% -14%, #fdf2e6 0%, transparent 64%),
    radial-gradient(1000px 600px at 94% 6%,   #f1f4fa 0%, transparent 58%),
    #faf7f3;
  background-attachment: fixed;
}
.scherm{ display: none; height: 100vh; flex-direction: column; }
.scherm.aan{ display: flex; }

/* ── bovenbalk ────────────────────────────────── */
/* Een zwevende balk die losstaat van de schermrand. Op een digibord van
   70 inch is de uiterste hoek de slechtste plek die er is: je ziet er
   niets en je raakt er niets. Alles staat daarom een stuk naar binnen,
   groot genoeg om van achter in de klas te lezen. De hoogte ligt vast en
   de klok gebruikt cijfers van gelijke breedte, zodat er nooit iets
   verschuift als de tijd verspringt of een groepsnaam langer is. */
.balk{
  /* Boven het pauzevlak, anders kun je het bord wel uitzetten maar niet
     meer aan: het vlak lag over de knop heen. */
  flex: none; height: 64px; position: relative; z-index: 400;
  margin: 16px 22px 2px;
  padding: 0 12px 0 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  background: rgba(255,255,255,.72);
  border-radius: 999px;
  /* De inzet bovenin is licht dat op de rand van het glas valt. Zonder
     dat ligt een doorzichtig vlak plat op de achtergrond; mét die lijn
     krijgt het een bovenkant en dus dikte.

     En de schaduw hoort bij de maat van het vlak: dit is het grootste
     zwevende ding op het scherm, dus staat hij verder van de ondergrond
     af dan het kleine wachtmerkje in een hoek. */
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8),
              0 1px 2px rgba(20,28,44,.05), 0 10px 30px rgba(20,28,44,.08);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.balk-links{ display: flex; align-items: center; gap: 13px; min-width: 0; }
.groepnaam{
  font-size: 1.34rem; font-weight: 640; letter-spacing: -.028em; color: var(--inkt);
  line-height: 1; white-space: nowrap;
}
.scheiding{
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--inkt-4); flex: none;
}
.datum{
  font-size: 1.02rem; font-weight: 500; color: var(--inkt-2);
  letter-spacing: -.01em; line-height: 1; white-space: nowrap;
}
.balk-rechts{ display: flex; align-items: center; gap: 14px; flex: none; }
.klok{
  font-size: 1.14rem; font-weight: 550; color: var(--inkt-2);
  letter-spacing: -.012em; line-height: 1;
  /* cijfers van gelijke breedte: "11:11" is even breed als "19:25" */
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}
/* Aan- en uitzetten van het bord. Tussen twee speelmomenten door zet de
   juf hem uit; dan kan er niemand meer slepen en staat het beeld stil. */
.bordknop{
  display: flex; align-items: center; gap: 9px;
  height: 40px; padding: 0 16px 0 13px; border-radius: 999px;
  font-size: .92rem; font-weight: 550; letter-spacing: -.01em;
  background: var(--goed-zacht); color: var(--goed);
  transition: background .16s ease, transform .16s var(--veer);
}
.bordknop:active{ transform: scale(.96); }
.bordknop-stip{
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: var(--goed); box-shadow: 0 0 0 3px rgba(46,158,107,.2);
}
.bordknop.uit{ background: rgba(20,28,44,.06); color: var(--inkt-3); }
.bordknop.uit .bordknop-stip{ background: var(--inkt-4); box-shadow: none; }

/* Het bord staat uit: alles blijft staan, maar er valt niets te slepen. */
.scherm.gepauzeerd .rooster,
.scherm.gepauzeerd .strook{ opacity: .4; pointer-events: none; filter: saturate(.55); }
.pauzevlak{
  /* Begint onder de balk, zodat de knoppen daar bereikbaar blijven. */
  position: fixed; top: 90px; right: 0; bottom: 0; left: 0; z-index: 300;
  display: none; align-items: center; justify-content: center;
  background: rgba(251,248,244,.35);
}
.scherm.gepauzeerd ~ .pauzevlak,
.pauzevlak.aan{ display: flex; }
.pauzekaart{
  text-align: center; padding: 34px 46px; border-radius: var(--rond-l);
  background: rgba(255,255,255,.9);
  box-shadow: 0 1px 2px rgba(20,28,44,.05), 0 14px 40px rgba(20,28,44,.1);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.pauzekaart .kop{ font-size: 1.6rem; font-weight: 600; letter-spacing: -.026em; color: var(--inkt); }
.pauzekaart .sub{ font-size: 1rem; color: var(--inkt-3); margin-top: 8px; }
.pauzekaart .knop{ margin-top: 20px; }
/* De dag is afgesloten: dat is meer dan een pauze, dus mag het vlak meer
   van het bord afdekken. */
.scherm.afgesloten .rooster,
.scherm.afgesloten .strook{ opacity: .22; pointer-events: none; filter: saturate(.3); }
.scherm.afgesloten ~ .pauzevlak{ display: flex; background: rgba(251,248,244,.62); }

/* het codeslot voor de instellingen */
.pinvak{ text-align: center; }
.pincijfers{ display: flex; gap: 12px; justify-content: center; margin: 24px 0 8px; }
.pincijfer{
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--vlak-2); box-shadow: inset 0 0 0 1.5px var(--lijn);
  transition: background .14s ease;
}
.pincijfer.vol{ background: var(--accent); box-shadow: none; }
.pintoetsen{ display: grid; grid-template-columns: repeat(3, 76px); gap: 12px;
             justify-content: center; margin-top: 22px; }
.pintoets{
  height: 62px; border-radius: 16px; background: var(--vlak-2);
  font-size: 1.5rem; font-weight: 500; color: var(--inkt);
  transition: background .12s ease, transform .12s var(--veer);
}
.pintoets:hover{ background: rgba(20,28,44,.1); }
.pintoets:active{ transform: scale(.94); }
.pintoets.leeg{ background: none; }
.pinmis{ color: var(--stop); font-size: .9rem; min-height: 1.3em; margin-top: 12px; }

.rondje{
  width: 44px; height: 44px; border-radius: 50%;   /* ruim genoeg voor een vinger */
  background: rgba(20,28,44,.05); display: flex; align-items: center; justify-content: center;
  transition: background .16s ease, transform .16s var(--veer);
}
.rondje:hover{ background: rgba(20,28,44,.1); }
.rondje:active{ transform: scale(.92); }

/* ── rooster ──────────────────────────────────────────── */
.rooster{
  flex-grow: 1; display: grid; min-height: 0;
  gap: var(--tussen, 18px); padding: 14px 22px 0;
  grid-template-columns: repeat(var(--kolommen, 3), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rijen, 2), minmax(0, 1fr));
}

/* ── hoekkaart ────────────────────────────────────────── */
/* De kaart is wit. Daarvoor had elke hoek zijn eigen gekleurde vlak, en
   met zes hoeken naast elkaar waren dat zes gekleurde vlakken die alle
   zes om aandacht vroegen -- terwijl het enige dat op dit bord aandacht
   verdient de kinderen zijn. Nu dragen de kinderen de kleur, en zegt de
   kaart alleen nog wáár ze zitten.

   De kleur van de hoek is er nog, maar op drie plekken waar hij iets
   betekent: de streep bovenaan (welke hoek is dit), het pictogram, en de
   open plekken (hier kan nog iemand bij). Nergens anders. */
.hoek{
  display: flex; flex-direction: column; min-height: 0; cursor: pointer;
  position: relative; overflow: hidden;
  background: #fff;
  border-radius: var(--kaartrond, 22px);
  box-shadow: 0 1px 2px rgba(20,28,44,.04), 0 6px 18px rgba(20,28,44,.07);
  transition: transform .2s var(--veer), box-shadow .2s ease;
}
/* De streep bovenaan: zo breed als de kaart, in de kleur van de hoek.
   Dit is het enige dat de hoeken uit elkaar houdt op afstand, dus hij
   mag stevig zijn -- maar hij ligt bovenaan en niet in het beeldvlak,
   zodat hij de kinderen niet beconcurreert. */
.hoek:not(.fotohoek)::before{
  content: ''; position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  height: max(4px, calc(var(--kaartrond, 22px) * .22));
  background: var(--hoekkleur, var(--accent));
}
.hoek:active{ transform: scale(.988); }
.hoek.doelwit{
  box-shadow: 0 0 0 4px var(--hoekkleur), 0 16px 34px var(--hoekschaduw);
  transform: translateY(-4px) scale(1.014);
}
.hoek.vol{ opacity: .96; }
.hoek.vol.doelwit{ box-shadow: 0 0 0 4px var(--let-op), 0 16px 34px rgba(200,130,10,.3); }

.hoek-beeld{
  height: var(--beeldhoogte, 100px); flex: none;
  background: var(--hoektint, #f2f4f7);
  display: flex; align-items: center; justify-content: center;
  background-size: cover; background-position: center;
}
/* Zonder foto is dit vak alleen de drager van het pictogram; dan hoeft
   er geen vlak omheen. En dan mag het ook lager: het vak was bijna de
   halve kaart hoog omdat het een gekleurd vlak was dat iets moest
   voorstellen. Een pictogram in de lucht heeft die hoogte niet nodig, en
   de ruimte die vrijkomt gaat naar de kinderen eronder. */
.hoek:not(.fotohoek) .hoek-beeld{
  background: transparent;
  height: calc(var(--beeldhoogte, 100px) * .78);
}
.hoek-beeld svg{ width: var(--icoongrootte, 56px); height: var(--icoongrootte, 56px); }

/* ── een hoek met een foto ────────────────────────────────
   Heeft een hoek een foto, dan is die foto de kaart. De naam en de plekken
   liggen eroverheen op een donkere waas, zodat je ze leest zonder dat de
   foto half wegvalt achter een balk. Foto's uit een telefoon zijn breder
   dan hoog; de kaart vult zich met de foto en snijdt zo min mogelijk weg. */
.hoek.fotohoek{ background: var(--hoektint, #f2f4f7); }
.hoek.fotohoek .hoek-beeld{
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  height: auto; z-index: 0;
}
.hoek.fotohoek .hoek-onder{
  position: relative; z-index: 1; margin-top: auto;
  flex-grow: 0;                       /* alleen zo hoog als de tekst vraagt */
  background: linear-gradient(to top,
    rgba(12,17,28,.86) 0%, rgba(12,17,28,.7) 48%, rgba(12,17,28,0) 100%);
  padding-top: calc(var(--onderpad, 12px) * 2.6);
}
/* de naam bovenaan zetten mag ook: dan blijft het midden van de foto vrij */
.hoek.fotohoek .hoek-kop{ margin-bottom: calc(var(--onderpad, 12px) * .5); }
.hoek.fotohoek .hoek-naam{
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.hoek.fotohoek .hoek-telling .bezet{ color: #fff; }
.hoek.fotohoek .hoek-telling .van{ color: rgba(255,255,255,.65); }
.hoek.fotohoek .plek.vrij{
  border-color: rgba(255,255,255,.75); opacity: .8;
}
.hoek.fotohoek .plek.gereserveerd{ border-color: rgba(255,255,255,.8); }
.hoek.fotohoek .wacht-merk{ background: rgba(12,17,28,.72); color: #fff; }

/* De naam van de hoek, en daar meteen onder wie er zit. Ze stonden eerst
   uit elkaar geduwd naar boven en beneden, en bij een hoge kaart gaapte
   daar een gat tussen. Bij elkaar houden leest rustiger en oogt op elke
   kaartgrootte hetzelfde. */
.hoek-onder{
  padding: var(--onderpad, 12px) calc(var(--onderpad, 12px) + 4px);
  display: flex; flex-direction: column; gap: calc(var(--onderpad, 12px) * .9);
  flex-grow: 1; min-height: 0; justify-content: flex-start;
}
.hoek-kop{ display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
/* De naam van de hoek staat in gewone inkt. Hij stond in de kleur van de
   hoek, en dan leest een rij hoeken als een rij etiketten die allemaal
   roepen. De kleur staat nu in de streep erboven; de naam hoeft hem niet
   nog eens te herhalen. */
.hoek-naam{
  font-size: var(--naamgrootte, 20px); font-weight: 620; letter-spacing: -.02em;
  color: var(--inkt);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hoek:not(.fotohoek) .hoek-telling .bezet{ color: var(--inkt-2); }
/* Ook de naam van een kind in een hoek: het kind draagt zijn eigen kleur
   in het rondje, en dat is genoeg. */
.hoek:not(.fotohoek) .plek.bezet .picto-naam{ color: var(--inkt-2); }
.hoek-telling{
  font-size: var(--tellinggrootte, 17px); font-weight: 600; flex: none;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.hoek-telling .bezet{ color: var(--hoektekst, var(--inkt)); }
.hoek-telling .van{ color: var(--inkt-4); font-weight: 500; }

/* zoveel plekken als de hoek heeft, altijd zichtbaar */
.hoek-plekken{
  display: flex; flex-wrap: nowrap; align-items: flex-start;
  /* Deze tussenruimte staat ook in slotVoor() in kb-bord.js -- die rekent
     uit hoeveel plekken er naast elkaar passen. Verander je hem hier, dan
     ook daar, anders lopen de plekken van een volle hoek van de kaart af.
     Hij is ruimer dan je voor rondjes alleen nodig hebt: er staat een
     naam onder, en die moet naast de buurman passen. */
  gap: calc(var(--slot, 40px) * .34);
}
.plek{
  width: var(--slot, 40px); height: var(--slot, 40px); border-radius: 50%;
  flex: none; display: flex; align-items: center; justify-content: center;
}
.plek.vrij{
  border: 2px dashed var(--hoekkleur, rgba(20,28,44,.2));
  opacity: .3; box-sizing: border-box;
}
.plek.gereserveerd{
  border: 2px dashed var(--hoekkleur); box-sizing: border-box; padding: 2px;
}
.plek.gereserveerd .picto-rond{
  width: 100%; height: 100%; opacity: .45; box-shadow: none;
  font-size: calc(var(--slot, 40px) * .38);
}

/* Wie in het volgende werkmoment aan de beurt is: alleen de naam, grijs,
   zodat je ziet wie er straks komt zonder dat het lijkt alsof hij er al
   zit. Zodra iemand van de ronde ervoor zijn plaatje eruit haalt, schuift
   deze naam naar voren. */
.plek.straks{
  border: 2px dashed var(--inkt-4); box-sizing: border-box;
  background: rgba(20,28,44,.035);
  color: var(--inkt-3); overflow: hidden;
}
.plek-naam{
  font-size: calc(var(--slot, 40px) * .3); font-weight: 600;
  letter-spacing: -.01em; line-height: 1; text-align: center;
  padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hoek.fotohoek .plek.straks{
  border-color: rgba(255,255,255,.5); background: rgba(12,17,28,.3);
  color: rgba(255,255,255,.85);
}
/* Wie in een hoek zit staat er met zijn naam onder. Die naam stond er
   eerst niet: de plek was precies zo groot als het rondje. Nu houdt de
   rij er ruimte voor vrij -- ook als er nog niemand zit, zodat de kaart
   niet gaat springen zodra er een kind bij komt -- en is het rondje een
   tikje kleiner. Het is er om gelezen te worden, dus staat de naam er
   stevig in en niet in muizenletters. */
.hoek-plekken{ padding-bottom: calc(var(--slot, 40px) * .62); }
.plek{ position: relative; }
.plek.bezet .picto{ position: static; }
/* Even groot als een lege plek ernaast: het zijn dezelfde plekken, en dan
   horen ze ook dezelfde maat te hebben. */
/* Net geland. Twee dingen tegelijk, allebei kort: het picto zet zich
   op zijn plaats, en er gaat één ring open die meteen weer vervaagt.
   Dat zegt "hier zit hij nu" zonder de aandacht op te eisen -- en het
   vervangt de sprong die er eerst zat, waarbij een kind precies op het
   moment van kijken zijn plaatje zag verspringen.

   De maat van de ring wordt gemeten en als --ringmaat meegegeven; de
   cirkel is op elk bord een andere grootte. */
@keyframes kb-landingsring{
  from{ transform: translateX(-50%) scale(.96); opacity: .5; }
  to  { transform: translateX(-50%) scale(1.55); opacity: 0; }
}
@keyframes kb-landingszet{
  0%  { transform: scale(.74); }
  58% { transform: scale(1.05); }
  100%{ transform: scale(1); }
}
.plek.netgeland::after{
  content: ''; position: absolute; top: 0; left: 50%;
  width: var(--ringmaat, 56px); height: var(--ringmaat, 56px);
  border-radius: 50%; pointer-events: none; z-index: 2;
  border: 2px solid var(--hoekkleur, var(--accent));
  animation: kb-landingsring .58s cubic-bezier(.2,.7,.3,1) forwards;
}
.plek.netgeland .picto-rond{
  animation: kb-landingszet .44s cubic-bezier(.22,.9,.25,1.02);
}
/* Wie bewegende beelden liever niet heeft, krijgt alleen het eindbeeld. */
@media (prefers-reduced-motion: reduce){
  .plek.netgeland::after{ display: none; }
  .plek.netgeland .picto-rond{ animation: none; }
}

.plek.bezet .picto-rond{
  width: var(--slot, 40px); height: var(--slot, 40px);
  font-size: calc(var(--slot, 40px) * .42);
}
/* De naam hangt onder het rondje, met lucht ertussen en lucht eronder.
   Dat laatste is niet vanzelfsprekend: met een regelhoogte die precies om
   de letters sluit valt de staart van een j of een g buiten het vakje, en
   met overflow:hidden erbij is hij dan gewoon weg. Vandaar 1,3 -- dat is
   ruim genoeg voor de staarten, en de plek eronder is meegegroeid. */
.plek.bezet .picto-naam{
  display: block; position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(var(--slot, 40px) * 1.08);
  width: calc(var(--slot, 40px) * 1.3);
  font-size: max(12px, calc(var(--slot, 40px) * .32));
  line-height: 1.3; font-weight: 600; letter-spacing: -.01em;
  color: var(--hoektekst, var(--inkt-2));
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hoek.fotohoek .plek.bezet .picto-naam{
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
}

/* als er nog helemaal niets klaarstaat */
.nogniets{
  align-self: center; justify-self: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 46px 54px; max-width: 520px;
  background: rgba(255,255,255,.72); border-radius: var(--rond-l);
  box-shadow: 0 1px 2px rgba(20,28,44,.04), 0 10px 30px rgba(20,28,44,.06);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
.nogniets-kop{ font-size: 1.5rem; font-weight: 600; letter-spacing: -.024em; color: var(--inkt); }
.nogniets-sub{ font-size: 1rem; color: var(--inkt-3); margin-top: 8px; max-width: 40ch; line-height: 1.55; }

.wacht-merk{
  position: absolute; top: 10px; right: 10px;
  font-size: .74rem; font-weight: 600; letter-spacing: -.01em;
  padding: 4px 11px; border-radius: 999px;
  background: rgba(255,255,255,.86); color: var(--let-op);
  box-shadow: 0 1px 3px rgba(20,28,44,.12);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.wacht-merk.beurt{ color: var(--hoekkleur); }

/* De strook was doorzichtig maar geen materiaal: de achtergrond schemerde
   er scherp doorheen, en dan is het geen glas maar een vlek. Met dezelfde
   vervaging als de balk hoort hij bij de rest, en de kinderen die erop
   staan komen ervan los. */
.strook{
  flex: none; margin: 16px 26px 20px; padding: 14px 22px;
  display: flex; align-items: center; gap: 26px; min-height: 0;
  background: rgba(255,255,255,.72); border-radius: var(--rond-l);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8),
              0 1px 2px rgba(20,28,44,.04), 0 8px 26px rgba(20,28,44,.07);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
/* Op een doorzichtig vlak is het lichtste grijs te licht: daarachter
   schuift een achtergrond langs die soms donker en soms licht is. Dus een
   tint donkerder en een haartje zwaarder -- dan blijft het staan, wat er
   ook achter gebeurt. */
.strook-kop{ font-size: .96rem; font-weight: 600; color: var(--inkt-2); white-space: nowrap;
             flex: none; }
/* De ruimte boven is er voor de gloed die om een kind verschijnt als je
   erover gaat: die steekt elf pixels boven de bol uit (drie van het
   optillen, twee van het vergroten, zes van de ring).

   Dat het uitmaakt komt door een regel die je makkelijk over het hoofd
   ziet: staat één as op overflow auto en de andere op visible, dan maakt
   de browser van die andere óók auto. Hier stond alleen overflow-x, om
   te kunnen schuiven bij veel kinderen -- maar daarmee werd er verticaal
   net zo goed afgesneden. Met vier pixels ruimte werd de ronde gloed
   vlak afgesneden: een rechte lijn dwars over een cirkel, en dat ziet
   eruit als een vierkant om het kind heen.

   Onder is minder nodig; daar loopt de gloed achter de naam langs. */
/* Bij veel kinderen moet deze rij kunnen schuiven, dus staat er
   overflow-x op. Twee dingen die daaruit volgen en die je makkelijk
   over het hoofd ziet:

   Ten eerste maakt de browser van de andere as dan óók 'auto' -- staat
   één as op auto en de andere op visible, dan wordt die visible
   genegeerd. Er wordt verticaal dus net zo goed afgesneden.

   Ten tweede helpt ruimte eróm niet. Ik heb het gemeten: met elf pixels
   speling tussen de rand van het vak en de bol werd de gloed nog steeds
   vlak afgesneden, en met overflow:visible bij precies dezelfde marge
   niet. Een scrollvak snijdt strakker af dan de buitenrand doet
   vermoeden.

   Dus zit de ruimte nu in de picto zelf: die schuift mee, en daarmee valt
   de gloed binnen de inhoud in plaats van erbuiten. De negatieve marge
   houdt de strook even hoog als voorheen. */
.strook-kinderen{ display: flex; gap: 6px; overflow-x: auto; padding: 2px 0;
                  align-items: flex-start; }
/* Boven zit de ruimte voor de gloed, onder voor de staart van een j of een
   g: een scrollvak snijdt aan alle kanten af, dus moet de lucht binnen de
   picto zitten en niet eromheen. */
.strook-kinderen .picto{ padding: 14px 10px 6px; }
.strook .picto-rond{ width: 62px; height: 62px; font-size: 1.4rem; }
.hoek-kinderen .picto-rond{ width: 46px; height: 46px; font-size: 1.05rem; }
.hoek-kinderen .picto-naam{ display: none; }

/* ── klas kiezen ──────────────────────────────────────── */
#scherm-klassen{ align-items: center; justify-content: center; padding: 30px; }
.klas-titel{ font-size: 2.6rem; font-weight: 650; letter-spacing: -.03em; margin: 0 0 8px;
              background: linear-gradient(96deg, #3b6ff0, #17a9bd 42%, #37ab74 72%, #e79a1f);
              -webkit-background-clip: text; background-clip: text; color: transparent; }
.klas-sub{ font-size: 1.05rem; color: var(--inkt-3); margin: 0 0 36px; }
.klas-rooster{ display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 220px)); gap: 18px; justify-content: center; }
.klas-kaart{ padding: 22px; text-align: left; transition: transform .2s var(--veer); }
.klas-kaart:hover{ transform: translateY(-3px); }
.klas-kaart .n{ font-size: 1.2rem; font-weight: 600; margin-bottom: 3px; }
.klas-kaart .s{ font-size: .9rem; color: var(--inkt-3); }

/* ── hoekdetail ───────────────────────────────────────── */
.detail-kop{ display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
.detail-icoon{ width: 62px; height: 62px; border-radius: 20px; background: var(--vlak-2);
               display: flex; align-items: center; justify-content: center; flex: none;
               background-size: cover; background-position: center; }
.detail-plekken{ display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 18px; }
.detail-plek{ display: flex; flex-direction: column; align-items: center; gap: 9px; }
.detail-plek .picto-rond{ width: 84px; height: 84px; font-size: 2rem; }
.detail-plek .ring{ top: -10px; right: -10px; bottom: -10px; left: -10px; }
.detail-plek .ring circle{ stroke-width: 5; }
.detail-stand{ font-size: .85rem; color: var(--inkt-3); text-align: center; }
.detail-stand.vrij{ color: var(--goed); font-weight: 600; }
.detail-leeg{ width: 104px; height: 104px; border-radius: 50%;
              border: 3px dashed rgba(20,28,44,.15); display: flex;
              align-items: center; justify-content: center; }

.rij-wacht{ display: flex; align-items: flex-end; justify-content: center; gap: 24px; margin: 26px 0; }
.rij-plek{ display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rij-nummer{ font-size: .9rem; font-weight: 600; color: var(--inkt-3); }
.rij-plek.ikzelf .rij-nummer{ color: var(--accent); font-weight: 700; }
.rij-plek .picto-rond{ width: 62px; height: 62px; font-size: 1.4rem; }
.rij-plek.ikzelf .picto-rond{ width: 84px; height: 84px; font-size: 2rem; }
.rij-ring{ padding: 5px; border-radius: 50%; background: rgba(59,111,240,.14); }

/* Het picto dat je optilt: alleen de bol, iets groter, met een schaduw
   die meegroeit. Dat leest als oppakken in plaats van als slepen. */
/* ── het kind dat je in je hand hebt ─────────────────────────────────
   Twee lagen, met opzet.

   De buitenste laag is de plek: die zet het bord elke beeldwisseling zelf
   neer, precies waar de vinger is. Daar staat dus géén overgang op. Er
   stond hier eerst `transition: left .16s, top .16s`, en dat was een
   bewuste verzachting die precies het verkeerde deed: het plaatje liep
   een zesde seconde achter je vinger aan. Dat voelt als stroop, en het is
   het verschil tussen "ik sleep dit" en "ik stuur iets aan dat daarna
   volgt". Bovendien schoven we `left` en `top` op, en dat zijn maten waar
   de browser de bladspiegel voor opnieuw moet uitrekenen -- zestig keer
   per seconde, voor elk kind dat sleept. Nu is het `transform`, en dat
   gaat buiten de bladspiegel om.

   De binnenste laag is hoe het kind eruitziet terwijl je het vasthoudt:
   opgetild, iets groter, een graadje gedraaid. Dat is een toestand en
   geen gebaar -- je vinger bestuurt het niet -- dus mag dat gewoon een
   overgang zijn.

   --pak-x en --pak-y zijn de plek waar je het kind beetpakte, binnen de
   bol. Daarmee blijft het punt waar je het oppakte onder je vinger
   liggen, in plaats van dat de bol naar je vinger toe springt. En de
   groei gaat om dat punt heen, zodat het kind onder je vinger uit
   opkomt. */
.sleep-geest{
  position: fixed; left: 0; top: 0; z-index: 500; pointer-events: none;
  will-change: transform;
}
.sleep-bol{
  transform: translate(calc(-1 * var(--pak-x, 50%)), calc(-1 * var(--pak-y, 50%)));
  transform-origin: var(--pak-x, 50%) var(--pak-y, 50%);
  filter: drop-shadow(0 2px 6px rgba(20,28,44,.18));
  transition: transform .2s var(--veer), filter .2s ease, opacity .18s ease;
}
.sleep-geest.opgetild .sleep-bol{
  transform: translate(calc(-1 * var(--pak-x, 50%)), calc(-1 * var(--pak-y, 50%)))
             scale(1.22) rotate(-4deg);
  filter: drop-shadow(0 16px 26px rgba(20,28,44,.3));
}
.sleep-geest.landt .sleep-bol{
  transform: translate(calc(-1 * var(--pak-x, 50%)), calc(-1 * var(--pak-y, 50%)))
             scale(.92) rotate(0deg);
  filter: drop-shadow(0 3px 8px rgba(20,28,44,.16));
}
.sleep-geest.valt-terug .sleep-bol{
  transform: translate(calc(-1 * var(--pak-x, 50%)), calc(-1 * var(--pak-y, 50%))) scale(.8);
  opacity: 0;
}
.picto.sleept .picto-rond{ transition: transform .2s var(--veer); transform: scale(.9); }

/* wie vandaag aan de beurt is in de werkplaats staat er alvast, wachtend */
.gereserveerd{
  position: relative; flex: none;
  padding: 3px; border-radius: 50%;
  border: 2px dashed rgba(59,111,240,.45);
}
.gereserveerd .picto-rond{ opacity: .45; box-shadow: none; }
.beurt-label{ background: rgba(59,111,240,.12); color: var(--accent); }

/* Minder doorzichtigheid: het glas op het bord wordt matglas. De vorm
   verandert niet, dus er verschuift niets -- alleen is er niets meer
   doorheen te zien, en dat is precies wat er gevraagd wordt. */
@media (prefers-reduced-transparency: reduce){
  .balk, .strook, .nogniets, .wacht-merk, .pauzekaart{
    background: var(--vlak) !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
  }
  .pauzevlak{ background: rgba(251,248,244,.92); }
}

/* Meer contrast: volle vlakken met een rand, zodat je van achter in de
   klas ziet waar de balk ophoudt en het bord begint. */
@media (prefers-contrast: more){
  .balk, .strook, .nogniets, .pauzekaart{
    background: #fff !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
    border: 1px solid var(--inkt-3);
  }
  .hoek{ border: 1px solid var(--inkt-3); }
}

@media (max-width: 760px){
  .balk{ height: 52px; margin: 10px 12px 0; padding: 0 6px 0 16px; }
  .scheiding{ display: none; }
  .rooster{ padding: 10px 12px 0; }
  .strook{ margin: 10px 12px 12px; padding: 10px 14px; gap: 14px; }
  .groepnaam{ font-size: 1.06rem; } .datum{ display: none; }
  .rondje{ width: 40px; height: 40px; }
  .bordknop{ padding: 0 12px 0 10px; font-size: .84rem; }
  .bordknop #knop-aanuit-tekst{ display: none; }
}
</style>
</head>
