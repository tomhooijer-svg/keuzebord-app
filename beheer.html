<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%23fbf8f4%22/%3E%3Ccircle%20cx=%2221%22%20cy=%2221%22%20r=%229%22%20fill=%22%233b6ff0%22/%3E%3Ccircle%20cx=%2243%22%20cy=%2221%22%20r=%229%22%20fill=%22%23e79a1f%22/%3E%3Ccircle%20cx=%2221%22%20cy=%2243%22%20r=%229%22%20fill=%22%232e9e6b%22/%3E%3Ccircle%20cx=%2243%22%20cy=%2243%22%20r=%229%22%20fill=%22%23b8436d%22/%3E%3C/svg%3E">
<title>Keuzebord — beheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- optical sizing laat Inter zich aanpassen aan de tekstgrootte: grote koppen
     krijgen strakkere letters. display=optional voorkomt dat de bladzijde
     verspringt als het lettertype later binnenkomt. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=optional">
<link rel="stylesheet" href="src/kb-stijl.css">
<style>


.paneel{ background: var(--vlak); border-radius: 18px;
          box-shadow: 0 0 0 1px rgba(20,28,44,.045), 0 1px 2px rgba(20,28,44,.04);
          padding: 22px 24px; }
.paneel + .paneel{ margin-top: 18px; }
.paneelkop{ font-size: .73rem; font-weight: 600; letter-spacing: .055em; text-transform: uppercase;
            color: var(--inkt-3); margin-bottom: 14px; }
.rooster2{ display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }

.rij{ display: flex; align-items: center; gap: 14px; padding: 13px 2px; border-bottom: 1px solid var(--vlak-2); }
.rij:last-child{ border-bottom: none; }
.rij-naam{ font-weight: 600; font-size: .95rem; }
.rij-sub{ font-size: .82rem; color: var(--inkt-3); }
.rij-acties{ margin-left: auto; display: flex; gap: 6px; flex: none; }

.schakel{
  width: 50px; height: 30px; border-radius: var(--rond-vol); background: rgba(20,28,44,.14);
  padding: 3px; display: flex; justify-content: flex-start; flex: none;
  transition: background .2s ease;
}
.schakel .knopje{ width: 24px; height: 24px; border-radius: 50%; background: #fff;
                  box-shadow: 0 1px 3px rgba(20,28,44,.22); transition: transform .22s var(--veer); }
.schakel.aan{ background: var(--accent); }
.schakel.aan .knopje{ transform: translateX(20px); }

.veld{ display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.veld label{ font-size: .8rem; font-weight: 600; color: var(--inkt-2); }
.veld input[type=text], .veld input[type=number], .veld input[type=password],
.veld input[type=search], .veld select{
  border: 1px solid var(--lijn); border-radius: 10px;
  padding: 10px 13px; font-size: .92rem; background: var(--vlak); width: 100%;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.veld input:focus, .veld select:focus{
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3.5px var(--accent-zacht);
}
.teller{ display: flex; align-items: center; gap: 12px; }
.teller button{ width: 34px; height: 34px; border-radius: 50%; background: var(--vlak-2); font-size: 1.1rem; font-weight: 600; }
.teller .w{ min-width: 42px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }


.doelrij{ display: flex; gap: 10px; align-items: flex-start; padding: 8px 11px; border-radius: var(--rond-s);
          cursor: pointer; font-size: .87rem; line-height: 1.45; border: 1.5px solid transparent; }
.doelrij:hover{ background: var(--vlak-2); }
.doelrij.aan{ background: var(--accent-zacht); border-color: #c9d9fb; }
.doelrij input{ margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.doelrij .aspect{ font-weight: 700; color: var(--inkt-3); font-size: .78rem; letter-spacing: .03em; }

.leerlingrooster{ display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; }
.leerlingkaart{ display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 6px;
                border-radius: var(--rond-m); transition: background .15s ease; }
.leerlingkaart:hover{ background: var(--vlak-2); }
.leerlingkaart .picto-rond{ width: 54px; height: 54px; font-size: 1.25rem; }

.hint{ font-size: .86rem; color: var(--inkt-3); line-height: 1.55; }
.uploadvak{ display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }


/* ── nieuwe onderdelen ───────────────────────────────────── */
.zij-scheiding{ height:1px; background:var(--lijn); margin:8px 10px; }
.knoprij{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.stip{ width:11px; height:11px; border-radius:50%; flex:none; }
.merkje{ font-size:.68rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
         background:var(--accent-zacht); color:var(--accent); padding:2px 8px;
         border-radius:var(--rond-vol); margin-left:8px; vertical-align:middle; }
.kindrij{ display:flex; gap:10px; flex-wrap:wrap; }
.leegvak{ padding:22px; border:1.5px dashed var(--lijn); border-radius:var(--rond-m); text-align:center; }
.tekstvak{ width:100%; min-height:110px; border:1.5px solid var(--lijn); border-radius:10px;
           padding:10px 12px; font-family:inherit; font-size:.9rem; resize:vertical; }
.signaal{ margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--let-op-zacht); }
.signaal-kop{ font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
              color:var(--let-op); margin-bottom:4px; }
.aanvink{ display:flex; align-items:center; gap:9px; font-size:.86rem; color:var(--inkt-2); cursor:pointer; }
.aanvink input{ width:16px; height:16px; accent-color:var(--accent); }
.kleurstip{ width:34px; height:34px; border-radius:50%; }
.kleurstip.aan{ box-shadow:0 0 0 3px var(--vlak), 0 0 0 5px currentColor; }
.fotovoorbeeld{ width:100%; height:96px; border-radius:12px; background:var(--vlak-2);
                background-size:cover; background-position:center; margin-bottom:8px; }
.wordrooster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;
              max-height:46vh; overflow-y:auto; padding:2px; }
.wordvak{ position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
          padding:12px 10px 10px; border-radius:var(--rond-m); background:var(--vlak-2);
          border:1.5px solid transparent; cursor:pointer; transition:border-color .15s ease, opacity .15s ease; }
.wordvak{ opacity:.5; }
.wordvak.mee{ opacity:1; border-color:var(--accent); background:var(--accent-zacht); }
.wordvink{ position:absolute; top:8px; left:8px; width:17px; height:17px; accent-color:var(--accent); }
.wordvak input{ width:100%; text-align:center; border:1.5px solid var(--lijn); border-radius:8px;
                padding:6px 8px; font-size:.85rem; background:var(--vlak); }

/* doelen */
.zoekregel{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.zoekregel input[type=search]{ flex-grow:1; min-width:200px; border:1.5px solid var(--lijn);
  border-radius:10px; padding:9px 12px; font-size:.9rem; background:var(--vlak); }
.tweeluik{ display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; align-items:start; margin-top:18px; }
.luik-links{ max-height:70vh; overflow-y:auto; }
.luik-rechts{ max-height:70vh; overflow-y:auto; }
.domeinkop{ font-size:.7rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
            color:var(--inkt-4); margin:14px 0 6px; }
.luikknop{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px;
           border-radius:var(--rond-s); text-align:left; transition:background .15s ease; }
.luikknop:hover{ background:var(--vlak-2); }
.luikknop.aan{ background:var(--accent-zacht); }
.luiknaam{ flex-grow:1; font-size:.88rem; font-weight:500; }
.luikteller{ font-size:.72rem; font-weight:600; color:var(--inkt-4); background:var(--vlak-2);
             padding:2px 8px; border-radius:var(--rond-vol); }
.luikteller.vol{ background:var(--goed-zacht); color:var(--goed); }
.doelkaart{ display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left;
            padding:11px 13px; border-radius:12px; border:1.5px solid var(--lijn);
            background:var(--vlak); margin-bottom:8px; transition:border-color .15s ease, background .15s ease; }
.doelkaart:hover{ border-color:var(--line-2, #c9d1e0); background:var(--vlak-2); }
.doelkaart.aan{ border-color:var(--accent); background:var(--accent-zacht); }
.doelvink{ width:22px; height:22px; border-radius:7px; border:2px solid var(--lijn); flex:none;
           display:flex; align-items:center; justify-content:center; color:transparent; margin-top:1px; }
.doelkaart.aan .doelvink{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── het Vandaag-overzicht ── */
.checkrij{ display:flex; align-items:flex-start; gap:12px; padding:11px 0;
           border-bottom:1px solid var(--vlak-2); }
.checkrij:last-child{ border-bottom:none; }
.checkmerk{ width:24px; height:24px; border-radius:50%; flex:none; margin-top:1px;
            display:flex; align-items:center; justify-content:center;
            font-size:.85rem; font-weight:700;
            background:var(--let-op-zacht); color:var(--let-op); }
.checkrij.goed .checkmerk{ background:var(--goed-zacht); color:var(--goed); }
.checktekst{ flex-grow:1; min-width:0; }

.weekbalkjes{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr));
              gap:8px; margin-top:14px; }
.weekbalkje{ background:var(--vlak-2); border-radius:10px; padding:9px 4px; text-align:center; }
.weekbalkje.vandaag{ background:var(--accent-zacht); }
.weekbalkje-dag{ font-size:.7rem; color:var(--inkt-3); text-transform:uppercase;
                 letter-spacing:.05em; font-weight:600; }
.weekbalkje-getal{ font-size:1.15rem; font-weight:600; font-variant-numeric:tabular-nums;
                   margin-top:2px; }
.weekbalkje.vandaag .weekbalkje-getal{ color:var(--accent); }

/* ── statistieken ── */
.statrij{ display:flex; align-items:flex-start; gap:11px; padding:9px 0;
          border-bottom:1px solid var(--vlak-2); }
.statrij:last-child{ border-bottom:none; }
.statmerk{ width:24px; height:24px; border-radius:50%; flex:none;
           display:flex; align-items:center; justify-content:center;
           font-size:.82rem; font-weight:700;
           background:var(--vlak-2); color:var(--inkt-3); }
.statmerk.stil, .statmerk.alleen{ background:var(--let-op-zacht); color:var(--let-op); }
.statmerk.maatjes{ background:var(--goed-zacht); color:var(--goed); }
.statmerk.lege-hoek, .statmerk.smalle-hoek{ background:var(--stop-zacht); color:var(--stop); }
.stattekst{ font-size:.9rem; color:var(--inkt); line-height:1.5; }

.staafrij{ display:grid; grid-template-columns:minmax(140px,1.4fr) minmax(80px,2fr) auto;
           align-items:center; gap:14px; padding:7px 0; }
.staafnaam{ display:flex; align-items:center; gap:6px; font-size:.88rem;
            color:var(--inkt); min-width:0; }
.staafnaam span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.staafbaan{ height:9px; border-radius:99px; background:var(--vlak-2); overflow:hidden; }
.staafbaan span{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.staafgetal{ font-size:.78rem; color:var(--inkt-3); white-space:nowrap;
             font-variant-numeric:tabular-nums; }

.kindrij-knop{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
               padding:9px 12px; border-radius:11px; transition:background .12s ease; }
.kindrij-knop:hover{ background:var(--vlak-2); }
.kindrij-knop.uitgeklapt{ background:var(--accent-zacht); }
.kindrij-tekst{ min-width:0; }
.kinddetail{ padding:6px 12px 16px 54px; }

.rondekop{ font-size:.68rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
           color:var(--inkt-4); margin:10px 0 5px; padding-top:8px;
           border-top:1px dashed var(--lijn); }
.kindchip-naam{ font-size:inherit; color:inherit; text-align:left; flex-grow:1; }
.kindchip-pijl{ width:20px; height:20px; border-radius:6px; flex:none;
                font-size:.8rem; line-height:1; color:var(--inkt-3);
                background:rgba(20,28,44,.05); transition:background .12s ease; }
.kindchip-pijl:hover:not(:disabled){ background:rgba(20,28,44,.12); color:var(--inkt); }
.kindchip-pijl:disabled{ opacity:.25; cursor:default; }
.kindchip.teveel{ opacity:.5; }

.dagvak{ background:var(--vlak-2); border-radius:12px; padding:12px 10px; text-align:center; }
.dagkop{ font-size:.8rem; font-weight:600; color:var(--inkt-2); margin-bottom:8px; }
.daghint{ font-size:.72rem; color:var(--inkt-3); margin-top:7px; }

.doelbalk{ margin-bottom:10px; }
.doelbalk .invoer{ font-size:.95rem; padding:10px 13px; }
.doelbladeraar{ margin-top:14px; }
.leerlijnen{ margin-top:10px; }
.leerlijnkop{ display:flex; align-items:center; justify-content:space-between; gap:12px;
              width:100%; text-align:left; padding:11px 14px; border-radius:11px;
              background:var(--vlak-2); margin-bottom:6px; transition:background .14s ease; }
.leerlijnkop:hover{ background:rgba(20,28,44,.09); }
.leerlijnkop.uitgeklapt{ background:var(--accent-zacht); }
.leerlijnnaam{ font-size:.94rem; font-weight:600; color:var(--inkt); }
.leerlijntel{ font-size:.78rem; color:var(--inkt-3); font-variant-numeric:tabular-nums; }
.leerlijninhoud{ padding:2px 0 12px 8px; border-left:2px solid var(--vlak-2); margin:0 0 10px 8px; }
.aspectkop{ font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
            color:var(--inkt-4); margin:12px 0 6px 8px; }
.doelkaart.suggestie{ border-color:var(--goed); background:var(--goed-zacht); }
.doelkaart.suggestie .doelvink{ border-color:var(--goed); color:var(--goed);
                                font-size:1rem; font-weight:700; }

/* de suggesties in het taakformulier zelf */
.tipkop{ font-size:.72rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
         color:var(--inkt-3); margin:14px 0 7px; }
.doeltip{ display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
          padding:9px 12px; border-radius:11px; background:var(--goed-zacht);
          margin-bottom:6px; transition:background .14s ease; }
.doeltip:hover{ background:#dcf0e7; }
.doeltip-plus{ width:20px; height:20px; border-radius:50%; flex:none; margin-top:1px;
               background:var(--goed); color:#fff; font-weight:700; font-size:.85rem;
               display:flex; align-items:center; justify-content:center; }
.doeltip-tekst{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.doeltip-boven{ font-size:.72rem; color:var(--goed); font-weight:600; }
.doeltip-zin{ font-size:.88rem; color:var(--inkt); line-height:1.4; }
.doelvink svg{ width:13px; height:13px; }
.doelinhoud{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.doelaspect{ font-size:.7rem; font-weight:700; letter-spacing:.05em; color:var(--inkt-3); }
.doelzin{ font-size:.9rem; line-height:1.45; }

/* taken */
.minichips{ display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.minichip{ font-size:.7rem; font-weight:600; color:var(--inkt-3); background:var(--vlak-2);
           padding:2px 8px; border-radius:var(--rond-vol); }
.gekozendoelen{ display:flex; flex-direction:column; gap:7px; margin-bottom:10px; }
.doelchip{ display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:10px;
           background:var(--accent-zacht); font-size:.85rem; line-height:1.4; }
.doelchip-niveau{ font-size:.7rem; font-weight:700; color:var(--accent); background:var(--vlak);
                  padding:2px 7px; border-radius:var(--rond-vol); flex:none; }
.doelchip-weg{ margin-left:auto; font-size:1.1rem; color:var(--inkt-3); line-height:1; flex:none; }
.kieslijst{ max-height:48vh; overflow-y:auto; padding:2px; }
.kiesrij{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px;
          border-radius:12px; transition:background .15s ease; }
.kiesrij:hover{ background:var(--vlak-2); }

/* weekplan */
.taakkop{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.weekrooster{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.weekdag{ background:var(--vlak-2); border-radius:12px; padding:10px; min-height:120px; }
.weekdag-kop{ display:flex; align-items:center; justify-content:space-between; gap:6px;
              font-size:.78rem; font-weight:600; color:var(--inkt-2); margin-bottom:8px; }
.weekdag-telling{ font-size:.68rem; font-weight:600; color:var(--inkt-3); background:var(--vlak);
                  padding:1px 7px; border-radius:var(--rond-vol); }
.weekdag-telling.vol{ background:var(--goed-zacht); color:var(--goed); }
.weekdag-vak{ display:flex; flex-direction:column; gap:6px; }
.weekdag-leeg{ font-size:.76rem; color:var(--inkt-4); padding:6px 2px; }
.kindchip{ display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:var(--rond-vol);
           background:var(--vlak); font-size:.82rem; font-weight:500; box-shadow:var(--schaduw-1);
           transition:transform .15s var(--veer); }
.kindchip:active{ transform:scale(.96); }
.restvak{ margin-top:16px; padding-top:14px; border-top:1px solid var(--vlak-2); }
.dagkeuze{ display:flex; flex-direction:column; gap:8px; }
.dagknop{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
          padding:13px 16px; border-radius:12px; border:1.5px solid var(--lijn); text-align:left; }
.dagknop.aan{ border-color:var(--accent); background:var(--accent-zacht); }
.dagknop.vol{ opacity:.45; }
.dagnaam{ font-weight:600; font-size:.92rem; }
.dagtelling{ font-size:.78rem; color:var(--inkt-3); }

/* observaties */
.observatierooster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:9px; }
.observatiekaart{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:12px;
                  border:1.5px solid var(--lijn); background:var(--vlak); text-align:left;
                  transition:border-color .15s ease, background .15s ease; }
.observatiekaart.nietingedeeld{ opacity:.55; }
.observatiekaart.stand-bezig{ border-color:var(--let-op); background:var(--let-op-zacht); }
.observatiekaart.stand-behaald{ border-color:var(--goed); background:var(--goed-zacht); }
.observatietekst{ min-width:0; }
.observatienaam{ font-size:.88rem; font-weight:600; }
.observatiestand{ font-size:.74rem; color:var(--inkt-3); }
.observatiekaart.stand-bezig .observatiestand{ color:var(--let-op); font-weight:600; }
.observatiekaart.stand-behaald .observatiestand{ color:var(--goed); font-weight:600; }

@media (max-width: 900px){
  .tweeluik{ grid-template-columns:minmax(0,1fr); }
  .luik-links, .luik-rechts{ max-height:none; }
  .weekrooster{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}


/* ── uiterlijk ───────────────────────────────────────────── */
.bordvoorbeeld{ display:flex; gap:12px; padding:22px; border-radius:18px; margin-bottom:18px;
                box-shadow:0 0 0 1px rgba(20,28,44,.05); transition:background .25s ease; }
.voorbeeldkaart{ flex:1; border-radius:12px; overflow:hidden;
                 box-shadow:0 1px 2px rgba(20,28,44,.06), 0 6px 16px rgba(20,28,44,.06); }
.voorbeeldbeeld{ height:44px; }
.voorbeeldnaam{ padding:8px 10px; font-size:.78rem; font-weight:600; }
.sfeerrooster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
.sfeerknop{ display:flex; flex-direction:column; gap:7px; padding:8px; border-radius:12px;
            border:1.5px solid var(--lijn); font-size:.82rem; font-weight:500; text-align:center;
            transition:border-color .15s ease, background .15s ease; }
.sfeerknop:hover{ background:var(--vlak-2); }
.sfeerknop.aan{ border-color:var(--accent); background:var(--accent-zacht); font-weight:600; }
.sfeervlak{ height:46px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(20,28,44,.06); }
.kleurrij{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
.kleurkiezer{ width:36px; height:36px; border:none; border-radius:50%; padding:0;
              background:none; cursor:pointer; }
.hoekvoorbeeld{ border-radius:14px; overflow:hidden; margin-top:10px; }
.hoekvoorbeeld-beeld{ height:56px; display:flex; align-items:center; justify-content:center;
