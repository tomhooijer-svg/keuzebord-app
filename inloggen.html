<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<!-- Er staan klaslijsten achter deze app. robots.txt werkt niet voor een
     projectsite (die moet op de domeinwortel staan), dus zeggen we het hier. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Zodat het bord op het digibord zelf als app open kan: zonder adresbalk,
     over het hele scherm. Op een Prowise-scherm doe je dat via het menu van
     de browser, "toevoegen aan beginscherm". -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d8eafb">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="stijl/logo/ptje.svg">
<title>Inloggen — Keuzebord</title>
<link rel="stylesheet" href="stijl/css/fonts.css?v=22oktober2026-2abc4ee7">
<link rel="stylesheet" href="stijl/css/tokens.css?v=22oktober2026-2abc4ee7">
<link rel="stylesheet" href="src/kb-stijl.css?v=22oktober2026-2abc4ee7">
<style>
body.inlog{
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 30px 20px;
  background:
    radial-gradient(1100px 620px at 8% -12%,  var(--pp-color-ice-soft, #eaf3fd) 0%, transparent 62%),
    radial-gradient(1000px 560px at 96% 4%,   var(--pp-color-butter-soft, #fdf4dc) 0%, transparent 58%),
    radial-gradient(900px 640px at 42% 110%,  var(--pp-color-white, #fff) 0%, transparent 60%),
    var(--pp-color-ice, #d8eafb);
}
.kaart{
  width: 100%; max-width: 420px;
  background: rgba(255,255,255,.86); border-radius: 22px; padding: 34px 32px 28px;
  box-shadow: 0 1px 2px rgba(20,28,44,.05), 0 14px 40px rgba(20,28,44,.09);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}
/* Hier stond een verloop van vier kleuren. Dat hoorde bij de vorige
   stijl; de huisstijl zegt: één accentkleur per scherm, en dat is hier
   de knop. Een naam in vier kleuren is dan een tweede accent dat niets
   betekent. Inkt dus, in de kopletter. */
.merk{
  font-size: 1.9rem; font-weight: 650; letter-spacing: -.032em; margin: 0 0 4px;
  font-family: var(--letter-kop); color: var(--inkt);
}
.onder{ font-size: .95rem; color: var(--inkt-3); margin: 0 0 26px; }
.veld{ margin-bottom: 14px; }
.veld label{ display: block; font-size: .83rem; font-weight: 550; color: var(--inkt-2);
             margin-bottom: 6px; letter-spacing: -.008em; }
.veld input{
  width: 100%; font: inherit; font-size: 1rem; color: var(--inkt);
  padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--lijn); background: #fff;
  transition: border-color .16s ease, box-shadow .16s ease;
}
.veld input:focus{
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3.5px var(--accent-zacht);
}
.groot{ width: 100%; display: flex; justify-content: center; padding: 14px 18px;
        font-size: 1.02rem; font-weight: 600; margin-top: 8px; }
.wissel{ margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--vlak-2);
         font-size: .89rem; color: var(--inkt-3); text-align: center; }
.wissel button{ color: var(--accent); font-weight: 600; font-size: inherit; }
.melder{
  margin: 0 0 16px; padding: 11px 14px; border-radius: 11px; font-size: .89rem;
  line-height: 1.5; display: none;
}
.melder.aan{ display: block; }
.melder.mis{ background: var(--stop-zacht); color: var(--stop); }
.melder.goed{ background: var(--goed-zacht); color: var(--goed); }
.bezig{ opacity: .55; pointer-events: none; }
.voet{ margin-top: 22px; text-align: center; font-size: .8rem; color: var(--inkt-4); line-height: 1.6; }
</style>
</head>
<body class="inlog">

<div class="kaart">
  <!-- Het logo van de school, als deze browser er een kent van de vorige
       keer. Op dit moment is nog niemand binnen, dus de app kan niet
       weten van welke school je bent; dit is hetzelfde vangnet als bij
       de kleuren. Op een schooldigibord klopt het altijd, op een vers
       apparaat verschijnt het na de eerste keer inloggen. -->
  <img class="schoollogo" id="schoollogo" alt="" style="display:none">
  <img class="merkteken" id="merkteken" src="stijl/logo/ptje.svg" alt=""
       aria-hidden="true" style="width:40px;height:40px;margin:0 auto 14px">
  <h1 class="merk">Keuzebord</h1>
  <p class="onder" id="onder">Log in om verder te gaan.</p>

  <div class="melder" id="melder"></div>

  <form id="formulier" novalidate>
    <div class="veld" id="veld-naam" style="display:none">
      <label for="naam">Je naam</label>
      <input id="naam" type="text" autocomplete="name" placeholder="Juf Marieke">
    </div>
    <!-- type="text" en niet "email": een gebruikersnaam is geen adres,
         en met type="email" weigert de browser hem te versturen. -->
    <div class="veld">
      <label for="email">Gebruikersnaam</label>
      <input id="email" type="text" autocomplete="username" required
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="juf.marieke">
    </div>
    <div class="veld">
      <label for="ww">Wachtwoord</label>
      <input id="ww" type="password" autocomplete="current-password" required>
    </div>
    <button class="knop knop-primair groot" id="verstuur" type="submit">Inloggen</button>
  </form>

  <div class="wissel" id="wissel"></div>
  <p class="voet">Werkt het even niet? Het bord blijft ook zonder verbinding gewoon
     werken; wat je doet gaat later vanzelf mee.</p>
</div>

<script src="src/kb-app.js?v=22oktober2026-2abc4ee7"></script>
<script src="src/kb-supabase.js?v=22oktober2026-2abc4ee7"></script>
<script src="src/kb-verhuizing.js?v=22oktober2026-2abc4ee7"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* Het logo van de school, uit wat deze browser onthield. Staat er een,
     dan neemt hij de plaats in van het p'tje -- voor een leerkracht is
     haar school belangrijker dan wie de app gemaakt heeft.

     Dit staat los van kb-data.js: deze pagina laadt dat bestand niet
     (het is een inlogscherm, geen bord), dus we lezen de opslag hier
     rechtstreeks. Dezelfde sleutel, één keer opgeschreven in
     KB.schoollogo en hier herhaald omdat er geen gedeelde plek is die
     allebei de pagina's kennen. */
  try {
    var logo = localStorage.getItem('kb_schoollogo');
    if (logo) {
      $('schoollogo').src = logo;
      $('schoollogo').style.display = '';
      $('merkteken').style.display = 'none';
    }
  } catch (e) {}
  var stand = 'aanmelden';          // of 'registreren'
  var bezig = false;

  function meld(tekst, soort){
    var m = $('melder');
    m.textContent = tekst || '';
    m.className = 'melder' + (tekst ? ' aan ' + (soort || 'mis') : '');
  }

  function teken(){
    var registreren = stand === 'registreren';
    $('onder').textContent = registreren
      ? 'Maak een account. Kies een gebruikersnaam zonder spaties, bijvoorbeeld juf.marieke.'
      : 'Log in om verder te gaan.';
    $('veld-naam').style.display = registreren ? '' : 'none';
    $('verstuur').textContent = registreren ? 'Account maken' : 'Inloggen';
    $('ww').autocomplete = registreren ? 'new-password' : 'current-password';
    $('wissel').innerHTML = registreren
      ? 'Heb je al een account? <button type="button" data-naar="aanmelden">Inloggen</button>'
      : 'Nog geen account? <button type="button" data-naar="registreren">Er een maken</button>' +
        '<br><button type="button" data-naar="vergeten" style="margin-top:8px;font-weight:500;color:var(--inkt-3)">Wachtwoord kwijt?</button>';
    meld('');
  }

  $('wissel').addEventListener('click', function (e) {
    var knop = e.target.closest('button[data-naar]');
    if (!knop) return;
    if (knop.dataset.naar === 'vergeten') return vergeten();
    stand = knop.dataset.naar; teken();
  });

  /* Wachtwoord vergeten gaat niet meer per mail. Dat is de prijs van
     inloggen zonder e-mailadres: er is geen adres om een link heen te
     sturen. Wie het kwijt is, krijgt een nieuw wachtwoord van iemand die
     daar wél bij kan -- de schoolbeheerder voor haar eigen team, de
     leverancier voor een schoolbeheerder.

     Dit stil weglaten zou erger zijn dan het uitleggen: dan staat iemand
     te zoeken naar een knop die er niet is. */
  function vergeten(){
    meld('Een nieuw wachtwoord krijg je van je schoolbeheerder. Is dat ' +
         'jij zelf? Neem dan contact op met de leverancier.', 'goed');
  }

  /* ── de pogingenrem ───────────────────────────────────────────────
     Na een paar misgeslagen pogingen moet je even wachten, en elke
     volgende keer langer.

     Wees eerlijk over wat dit is: deze rem zit in de browser, en
     inloggen gaat rechtstreeks naar Supabase. Wie deze pagina overslaat
     en de server zelf aanroept, merkt er niets van. Dit remt dus een
     mens -- een kind dat aan het digibord wachtwoorden zit te proberen,
     een collega die blijft gokken -- en geen programma.

     De echte rem staat in Supabase zelf, bij Authentication → Rate
     Limits. Die hoort aan te staan; zie docs/HERSTEL.md en
     DECISIONS.md. Zolang die er is, zijn drie woorden en een cijfer
     genoeg. Valt die weg, dan moeten de wachtwoorden langer.

     De telling staat per browser en per naam. Niet per account op de
     server: dan kon iemand een juf buitensluiten door tien keer een
     fout wachtwoord voor haar in te typen, en dat is een aanval op
     zichzelf. */
  var REM_NA = 5;                       // zoveel misslagen mogen vrijuit
  var REM_TIJDEN = [10, 30, 60, 120, 300];   // daarna wachten, in seconden

  function remLees(){
    try { return JSON.parse(localStorage.getItem('kb_pogingen') || '{}'); }
    catch (e) { return {}; }
  }
  function remSchrijf(p){
    try { localStorage.setItem('kb_pogingen', JSON.stringify(p)); } catch (e) {}
  }
  function remSleutel(naam){ return String(naam || '').trim().toLowerCase(); }

  /* Hoeveel seconden moet deze naam nog wachten? */
  function remWacht(naam){
    var p = remLees()[remSleutel(naam)];
    if (!p || !p.tot) return 0;
    return Math.max(0, Math.ceil((p.tot - Date.now()) / 1000));
  }

  function remMisgeslagen(naam){
    var alles = remLees(), k = remSleutel(naam);
    var p = alles[k] || { aantal: 0, tot: 0 };
    p.aantal++;
    if (p.aantal > REM_NA) {
      var i = Math.min(p.aantal - REM_NA - 1, REM_TIJDEN.length - 1);
      p.tot = Date.now() + REM_TIJDEN[i] * 1000;
    }
    alles[k] = p;
    remSchrijf(alles);
  }

  function remGelukt(naam){
    var alles = remLees();
    delete alles[remSleutel(naam)];
    remSchrijf(alles);
  }

  function wachttekst(sec){
    if (sec >= 60) {
      var m = Math.ceil(sec / 60);
      return m === 1 ? 'een minuut' : m + ' minuten';
    }
    return sec + ' seconden';
  }

  function toonFout(e){
    if (SB.isTeVaak(e)) {
      /* Niet onze eigen rem maar die van Supabase: dertig pogingen per
         vijf minuten vanaf hetzelfde IP-adres. Op een school delen alle
         apparaten één adres naar buiten, dus dit kan ook iemand raken
         die niets fout deed. */
      meld('Er is vanaf deze school te vaak geprobeerd in te loggen. ' +
           'Wacht vijf minuten en probeer het dan nog eens.');
    } else if (e && e.offline) {
      meld('Geen verbinding met de server. Controleer het internet en probeer het opnieuw.');
    } else if (e && /invalid login|klopt niet|credentials/i.test(e.message || '')) {
      /* Niet zeggen wélke van de twee fout is. Zou er staan "die
         gebruikersnaam kennen we niet", dan kan iemand met een lijstje
         namen uitvinden wie hier werkt. */
      meld('Deze gebruikersnaam of dit wachtwoord klopt niet.');
    } else if (e && /already registered|al een account/i.test(e.message || '')) {
      meld('Deze gebruikersnaam is al in gebruik. Kies een andere, of log in.');
    } else {
      meld((e && e.message) || 'Er ging iets mis. Probeer het nog eens.');
    }
  }

  function verder(){
    // Waar hoort deze persoon heen? De platformbeheerder hoort bij geen
    // school en gaat naar het platformbeheer; wie nog geen school heeft
    // moet er eerst een beginnen; een schoolbeheerder gaat naar het
    // schoolbeheer, een leerkracht naar haar eigen groep.
    return SB.wieBenIk().then(function (ik) {
      if (ik.profiel && ik.profiel.rol === 'platformbeheerder') { location.href = 'platform.html'; return; }
      if (!ik.profiel || !ik.profiel.school_id) { location.href = 'school.html?nieuw=1'; return; }
      if (ik.profiel.rol === 'schoolbeheerder') { location.href = 'school.html'; return; }
      location.href = 'beheer.html';
    }).catch(function (e) {
      // Inloggen lukte, maar de rest niet. Dan maar naar het bord: dat
      // werkt ook zonder verbinding.
      if (e && e.offline) { location.href = 'bord.html'; return; }
      throw e;
    });
  }

  $('formulier').addEventListener('submit', function (e) {
    e.preventDefault();
    if (bezig) return;
    var email = $('email').value.trim();
    var ww    = $('ww').value;
    if (!email) { meld('Vul je gebruikersnaam in.'); $('email').focus(); return; }
    if (!ww)    { meld('Vul je wachtwoord in.');  $('ww').focus();    return; }

    var wacht = remWacht(email);
    if (wacht > 0) {
      meld('Te vaak misgeslagen. Probeer het over ' + wachttekst(wacht) + ' nog eens.');
      return;
    }
    if (stand === 'registreren' && ww.length < 8) {
      meld('Kies een wachtwoord van minstens acht tekens.'); $('ww').focus(); return;
    }

    bezig = true;
    document.querySelector('.kaart').classList.add('bezig');
    meld('');

    var werk = stand === 'registreren'
      ? SB.registreren(email, ww, $('naam').value.trim())
      : SB.aanmelden(email, ww);

    werk.then(function (uit) {
      if (uit && uit.bevestigen) {
        meld('Je account staat klaar, maar moet nog bevestigd worden. ' +
             'Lukt inloggen niet, meld het dan bij de leverancier.', 'goed');
        return;
      }
      remGelukt(email);
      return verder();
    }).catch(function (e) {
      /* Alleen tellen bij een afgewezen inlogpoging. Geen verbinding of
         een server die piept is geen misslag -- dan zou een school met
         slecht wifi zichzelf buitensluiten. */
      if (e && !e.offline && /invalid login|klopt niet|credentials/i.test(e.message || '')) {
        remMisgeslagen(email);
        var nu = remWacht(email);
        if (nu > 0) {
          meld('Te vaak misgeslagen. Probeer het over ' + wachttekst(nu) + ' nog eens.');
          return;
        }
      }
      toonFout(e);
    }).then(function () {
      bezig = false;
      document.querySelector('.kaart').classList.remove('bezig');
    });
  });

  // Al ingelogd? Dan meteen door.
  if (SB.ingelogd()) {
    document.querySelector('.kaart').classList.add('bezig');
    verder().catch(function () {
      document.querySelector('.kaart').classList.remove('bezig');
    });
  }
  teken();
  $('email').focus();
})();
</script>
</body>
</html>
